<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09131b" />
    <title>猫鼠大战 · 可玩雏形</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">猫</span>
          <div>
            <p class="eyebrow">CAT MOUSE · PROTOTYPE</p>
            <h1>猫鼠大战</h1>
          </div>
        </div>
        <div class="match-meta">
          <span class="live-dot"></span>
          <span id="matchStatus">对局进行中</span>
          <span class="divider"></span>
          <span id="timerText">08:00</span>
        </div>
      </header>

      <section class="game-layout">
        <div class="stage-column">
          <div class="role-switch" aria-label="角色选择">
            <button class="role-button is-active" data-role="mouse">老鼠阵营</button>
            <button class="role-button" data-role="cat">猫阵营</button>
          </div>

          <div class="stage-frame">
            <canvas id="gameCanvas" aria-label="猫鼠大战游戏地图"></canvas>
            <div class="canvas-hint" id="canvasHint">拖动左下摇杆移动，靠近中心事件区可触发事件</div>
            <div class="event-banner is-hidden" id="eventBanner"></div>
          </div>

          <div class="mobile-controls">
            <div class="joystick" id="joystick" aria-label="虚拟摇杆">
              <div class="joystick-ring"></div>
              <div class="joystick-knob" id="joystickKnob"></div>
            </div>
            <div class="quick-actions">
              <button class="action-button action-primary" id="attackButton"><span class="action-icon">爪</span><span>攻击</span></button>
              <button class="action-button" id="eventButton"><span class="action-icon">✦</span><span>事件</span></button>
            </div>
          </div>
        </div>

        <aside class="control-panel">
          <div class="status-strip">
            <div class="status-cell"><span class="status-label">资源</span><strong id="goldText">320</strong></div>
            <div class="status-cell"><span class="status-label">存活鼠</span><strong id="miceAliveText">10</strong></div>
            <div class="status-cell"><span class="status-label">存活猫</span><strong id="catsAliveText">2</strong></div>
          </div>

          <div class="player-card">
            <div class="player-avatar mouse-avatar" id="playerAvatar">鼠</div>
            <div class="player-copy">
              <span class="status-label">当前身份</span>
              <strong id="roleText">老鼠 · 守门人</strong>
              <span class="subtle" id="playerHint">房子 1 · 建设与防守</span>
            </div>
            <div class="health-wrap">
              <span class="health-label">HP</span>
              <div class="health-bar"><span id="playerHealthBar"></span></div>
              <span class="health-value" id="playerHealthText">100%</span>
            </div>
          </div>

          <div class="event-card">
            <div class="section-heading"><span>中心事件区</span><span class="event-timer" id="eventTimerText">60s</span></div>
            <strong id="eventName">等待随机事件</strong>
            <p id="eventDescription">任何玩家进入中心区域，都可能改变战局。</p>
          </div>

          <div class="upgrade-section">
            <div class="section-heading"><span id="upgradeTitle">防守升级</span><span class="section-note">原型数值</span></div>
            <div class="upgrade-list" id="upgradeList"></div>
          </div>

          <div class="feed" id="feed" aria-live="polite"></div>
          <button class="reset-button" id="resetButton">重新开始原型对局</button>
        </aside>
      </section>

      <footer class="footer-note">
        <span>Canvas prototype · 后续可替换为生成的 PNG 图集</span>
        <span>服务端：<span id="serverStatus">检测中</span></span>
      </footer>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
